name: asael
description: Asael command center for mobile and desktop.
publish_to: 'none'
version: 1.11.0+21

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^10.0.0
  go_router: ^16.2.1
  local_auth: ^3.0.2
  file_picker: ^12.2.0
  record: ^7.1.1
  mime: ^2.1.0
  cryptography: ^2.9.0
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  connectivity_plus: ^7.3.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^19.5.0
  desktop_drop: ^0.8.4
  path: ^1.9.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Keep this pin until flutter_secure_storage publishes the macOS fix from
# upstream commit 8d1209c. Without it, private-signed builds issue an invalid
# synchronizable Keychain probe even when the data-protection Keychain is off.
dependency_overrides:
  flutter_secure_storage_darwin:
    git:
      url: https://github.com/juliansteenbakker/flutter_secure_storage.git
      ref: 8d1209c9debd56b176a2efe99c308ba47d2b56e8
      path: flutter_secure_storage_darwin

flutter:
  uses-material-design: true
  assets:
    - assets/brand/asael-mark.png

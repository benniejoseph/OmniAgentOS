name: asael
description: Asael command center for mobile and desktop.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^10.0.0
  go_router: ^16.2.1
  local_auth: ^3.0.2
  file_picker: ^12.2.0
  record: ^7.1.1
  mime: ^2.1.0
  cryptography: ^2.9.0
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  connectivity_plus: ^7.3.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/asael-mark.png

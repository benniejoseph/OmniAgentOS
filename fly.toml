app = "omniagent-worker"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.worker"

[deploy]
  strategy = "immediate"

[env]
  OMNIAGENT_WORKER_BASE_URL = "https://omniagent-os.vercel.app"
  OMNIAGENT_DEFAULT_TENANT = "default"
  OMNIAGENT_WORKER_INTERVAL_MS = "5000"
  OMNIAGENT_WORKER_LIMIT = "5"
  OMNIAGENT_WORKER_SLO = "true"
  OMNIAGENT_WORKER_ALERTS = "true"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

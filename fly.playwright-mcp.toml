app = "omniagent-os-browser"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile.playwright-mcp"

[deploy]
  strategy = "bluegreen"

[env]
  OMNIAGENT_PLAYWRIGHT_MCP_PORT = "8080"
  OMNIAGENT_PLAYWRIGHT_MCP_EGRESS_PROXY_PORT = "8899"
  OMNIAGENT_PLAYWRIGHT_MCP_MAX_CONCURRENCY = "8"
  OMNIAGENT_PLAYWRIGHT_MCP_MAX_SCOPES = "2"
  OMNIAGENT_PLAYWRIGHT_MCP_PUBLIC_HOST = "omniagent-os-browser.fly.dev"
  OMNIAGENT_PLAYWRIGHT_MCP_SCOPE_RECLAIM_IDLE_MS = "120000"
  OMNIAGENT_PLAYWRIGHT_MCP_SCOPE_TTL_MS = "1800000"
  OMNIAGENT_PLAYWRIGHT_MCP_UPSTREAM_START_TIMEOUT_MS = "30000"
  PLAYWRIGHT_MCP_PING_TIMEOUT_MS = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 16

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ vars.PRODUCTION_SMOKE_BASE_URL || 'https://omniagent-os.vercel.app' }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_INTERNAL_AUTH_SECRET: ${{ secrets.SMOKE_INTERNAL_AUTH_SECRET }}
      EXPECT_SECURE_COOKIES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Run production smoke gates
        run: npm run test:production-smoke

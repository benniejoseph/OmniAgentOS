name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: "Exact deployed Git revision to verify; omit to discover the currently served revision."
        required: false
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  # The provenance gate reads the served commit's check runs.
  checks: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      BASE_URL: ${{ vars.PRODUCTION_SMOKE_BASE_URL }}
      SMOKE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_SYNTHETIC_SOURCE: production-smoke
      SMOKE_REQUEST_TIMEOUT_MS: "300000"
      EXPECT_SECURE_COOKIES: "true"
      RELEASE_EVIDENCE_OUTPUT: artifacts/release-evidence.json
      RELEASE_EVIDENCE_MAX_BYTES: "262144"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.13.0"
          cache: npm

      - name: Resolve production revision
        env:
          REQUESTED_SMOKE_REVISION: ${{ inputs.expected_revision }}
        run: node scripts/resolve-production-smoke-revision.mjs

      # Production must serve a commit on main whose required CI passed, which
      # the paired release runner enforces. A red gate means production was
      # changed outside that runner.
      - name: Release provenance gate
        id: provenance
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: RELEASE_REVISION="$SMOKE_EXPECTED_REVISION" node scripts/release-provenance.mjs

      - name: Install
        run: npm ci --omit=dev

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Preflight production target
        id: preflight
        timeout-minutes: 3
        env:
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_INTERNAL_AUTH_SECRET: ${{ secrets.SMOKE_INTERNAL_AUTH_SECRET }}
          SMOKE_CRON_SECRET: ${{ secrets.SMOKE_CRON_SECRET }}
        run: npm run smoke:preflight

      - name: Security gate
        id: security
        continue-on-error: true
        timeout-minutes: 8
        env:
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_INTERNAL_AUTH_SECRET: ${{ secrets.SMOKE_INTERNAL_AUTH_SECRET }}
        run: npm run smoke:security

      - name: Tenant isolation gate
        id: tenant
        continue-on-error: true
        timeout-minutes: 8
        env:
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_INTERNAL_AUTH_SECRET: ${{ secrets.SMOKE_INTERNAL_AUTH_SECRET }}
        run: npm run smoke:tenant

      - name: Evaluation gate
        id: evaluation
        continue-on-error: true
        timeout-minutes: 6
        env:
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_INTERNAL_AUTH_SECRET: ${{ secrets.SMOKE_INTERNAL_AUTH_SECRET }}
        run: npm run smoke:eval

      - name: Release evidence gate
        id: release
        continue-on-error: true
        timeout-minutes: 6
        env:
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_INTERNAL_AUTH_SECRET: ${{ secrets.SMOKE_INTERNAL_AUTH_SECRET }}
        run: npm run smoke:release

      - name: Verify release evidence artifact
        id: evidence
        if: always()
        continue-on-error: true
        run: |
          test -s "$RELEASE_EVIDENCE_OUTPUT"
          test "$(wc -c < "$RELEASE_EVIDENCE_OUTPUT")" -le "$RELEASE_EVIDENCE_MAX_BYTES"

      - name: Upload release evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: production-release-evidence
          path: artifacts/release-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce production gates
        if: always()
        env:
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
          TENANT_OUTCOME: ${{ steps.tenant.outcome }}
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          failures=()
          for gate in PROVENANCE PREFLIGHT SECURITY TENANT EVALUATION RELEASE EVIDENCE UPLOAD; do
            outcome_variable="${gate}_OUTCOME"
            outcome="${!outcome_variable}"
            if [ "$outcome" != "success" ]; then
              failures+=("${gate,,}=${outcome:-missing}")
            fi
          done
          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'FAIL production smoke gates: %s\n' "${failures[*]}"
            exit 1
          fi
          echo "PASS all production smoke gates and release evidence upload"

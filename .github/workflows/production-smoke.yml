name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      BASE_URL: ${{ vars.PRODUCTION_SMOKE_BASE_URL || 'https://omniagent-os.vercel.app' }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_INTERNAL_AUTH_SECRET: ${{ secrets.SMOKE_INTERNAL_AUTH_SECRET }}
      SMOKE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_SYNTHETIC_SOURCE: production-smoke
      EXPECT_SECURE_COOKIES: "true"
      RELEASE_EVIDENCE_OUTPUT: artifacts/release-evidence.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Run production smoke gates
        run: |
          mkdir -p artifacts
          npm run test:production-smoke

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-evidence
          path: artifacts/release-evidence.json
          if-no-files-found: warn

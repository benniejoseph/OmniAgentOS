title = "OmniAgent secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Firebase native client configuration contains public project-identification API keys."
targetRules = ["gcp-api-key", "generic-api-key"]
paths = [
  '''^apps/flutter/android/app/google-services\.json$''',
  '''^apps/flutter/(ios|macos)/Runner/GoogleService-Info\.plist$''',
]

[[allowlists]]
description = "Native connector test fixture keySha256 fields are public digest identifiers, not API credentials."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^apps/flutter/test/fixtures/native_mcp_discovery\.json$''',
  '''^apps/flutter/test/fixtures/native_github_upgrade\.json$''',
  '''^tests/fixtures/native-github-upgrade\.json$''',
]
regexes = ['''^\s*"keySha256": "[a-f0-9]{64}",?\s*$''']

[[allowlists]]
description = "Frozen v46/v47 OpenAPI file SHA-256 assertions are published artifact digests."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^src/lib/mobile/contracts\.test\.ts$''']
regexes = ['''^\s*"openapi\.json": "(?:338f0ffe6f4e2051a87b85d77f8aec605bb639b7c06de232b4989a69e15a1233|cc783eff3bf60b6a198607c4fce70c8d87b12bbbccec5b1909106e67084f6b24)",?\s*$''']
